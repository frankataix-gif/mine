<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>员工日常</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="员工日常">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --primary: #2563eb;
    --danger: #ef4444;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  header { background: var(--primary); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 17px; font-weight: 600; }
  .homebtn, .addbtn { background: rgba(255,255,255,.2); color: #fff; border-radius: 8px; padding: 5px 11px; font-size: 14px; text-decoration: none; border: none; cursor: pointer; min-height: 32px; }
  #syncStatus { font-size: 12px; opacity: .9; margin-top: 2px; }
  #syncStatus.pending { color: #fde047; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; padding-bottom: 80px; }
  .card { background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card h3 { font-size: 14px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: #fff; box-sizing: border-box; }
  button { min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; }
  .primary { background: var(--primary); color: #fff; }
  .secondary { background: var(--border); color: var(--text); }
  .danger { background: var(--danger); color: #fff; }
  .btn-block { width: 100%; margin-top: 6px; }
  .feed { display: flex; flex-direction: column; gap: 12px; }
  .post { background: var(--card); border-radius: 10px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .post-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .post-user { font-weight: 600; }
  .post-time { font-size: 12px; color: var(--muted); }
  .post-note { margin-bottom: 10px; font-size: 15px; line-height: 1.5; }
  .post-media { display: grid; gap: 4px; border-radius: 8px; overflow: hidden; }
  .post-media.one { grid-template-columns: 1fr; }
  .post-media.two { grid-template-columns: 1fr 1fr; }
  .post-media.multi { grid-template-columns: 1fr 1fr 1fr; }
  .post-media img { width: 100%; height: 180px; object-fit: cover; display: block; background: #111; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 200; }
  .hidden { display: none; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 16px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-head h3 { font-size: 16px; }
  .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .upload-slot { aspect-ratio: 1; background: #f8fafc; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .upload-add { border: 1px dashed #cbd5e1; color: #94a3b8; font-size: 32px; cursor: pointer; }
  .upload-img { width: 100%; height: 100%; object-fit: cover; }
  .upload-del { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: rgba(0,0,0,.5); color: #fff; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; padding: 0; min-height: 20px; }
  .upload-del:hover { background: var(--danger); }
</style>
</head>
<body>

<header>
  <button class="homebtn" onclick="goHome()" title="返回">⌂ 主页</button>
  <h1>员工日常</h1>
  <button class="addbtn" id="openPublish" title="发布">+</button>
</header>

<main>
  <div id="feed" class="feed"></div>
</main>

<div id="publishModal" class="modal-mask">
  <div class="modal">
    <div class="modal-head">
      <h3>发布日常</h3>
      <button class="secondary" id="closePublish" style="min-height:32px;padding:4px 12px">取消</button>
    </div>
    <div class="field" style="margin-top:0">
      <textarea id="uNote" rows="3" placeholder="这一刻的想法..." style="border:none;background:transparent;padding:0 2px;font-size:16px;resize:none;outline:none"></textarea>
    </div>
    <div class="upload-grid" id="uPreviewGrid">
      <div class="upload-slot upload-add" id="uAddBtn" onclick="document.getElementById('uFile').click()">+</div>
    </div>
    <input type="file" id="uFile" accept="image/*" multiple style="display:none">
    <button class="primary btn-block" id="uSubmit" style="height:48px;font-size:16px">发 布</button>
    <p class="hint">照片会自动压缩，最多 9 张。视频目前暂不支持。</p>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const DATA_FILE = 'data/field_log.json';
let log = { photos: [], updatedAt: '' };
let currentUser = 'unknown';
let uploadQueue = [];

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|;)\\s*' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function parseUser() {
  const c = getCookie('app_auth');
  if (!c) return 'unknown';
  if (!c.includes(':')) return '管理员';
  const i = c.indexOf(':');
  return i > 0 ? c.slice(0, i) : c;
}
currentUser = parseUser();

async function api(action, data) {
  const body = { action, ...data };
  const res = await fetch('/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return await res.json();
}

function setStatus(msg, pending) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = pending ? 'pending' : '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

async function loadLog() {
  setStatus('同步中…', true);
  try {
    const r = await api('read', { path: DATA_FILE });
    if (r.content) log = JSON.parse(r.content);
    else log = { photos: [], updatedAt: new Date().toISOString() };
    setStatus('已同步', false);
    renderFeed();
  } catch (e) {
    setStatus('同步失败', false);
    showToast('读取失败：' + e.message);
  }
}

async function saveLog(message) {
  setStatus('保存中…', true);
  log.updatedAt = new Date().toISOString();
  try {
    const r = await api('save', { path: DATA_FILE, content: JSON.stringify(log, null, 2), message: message || 'Update field log' });
    if (r.error) throw new Error(r.error);
    setStatus('已保存', false);
    renderFeed();
    return true;
  } catch (e) {
    setStatus('保存失败', false);
    showToast('保存失败：' + e.message);
    return false;
  }
}

function id() { return 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }

function fmtDate(s) { return s ? new Date(s).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }

function renderFeed() {
  const feed = document.getElementById('feed');
  const posts = {};
  const sorted = log.photos.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  for (const p of sorted) {
    const key = p.note + '|' + p.createdAt;
    if (!posts[key]) posts[key] = { ...p, photos: [] };
    posts[key].photos.push(p);
  }
  const list = Object.values(posts);
  if (!list.length) { feed.innerHTML = '<div class="empty">还没有动态，点右上角 + 发布第一条</div>'; return; }
  feed.innerHTML = list.map(post => {
    const cls = post.photos.length === 1 ? 'one' : post.photos.length === 2 ? 'two' : 'multi';
    return `
      <div class="post">
        <div class="post-head">
          <span class="post-user">${post.uploader}</span>
          <span class="post-time">${fmtDate(post.createdAt)}</span>
        </div>
        ${post.note ? `<div class="post-note">${post.note.replace(/\n/g, '<br>')}</div>` : ''}
        <div class="post-media ${cls}">
          ${post.photos.map(p => `<img src="/photos/${p.filename}" loading="lazy" alt="">`).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// 发布弹窗
const modal = document.getElementById('publishModal');
document.getElementById('openPublish').onclick = () => { modal.classList.add('show'); fillProjectSelect ? 0 : 0; };
document.getElementById('closePublish').onclick = () => { modal.classList.remove('show'); };
modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };

const uFile = document.getElementById('uFile');
const uPreviewGrid = document.getElementById('uPreviewGrid');

document.getElementById('uAddBtn').onclick = () => uFile.click();

function renderUploadGrid() {
  uPreviewGrid.innerHTML = '';
  uploadQueue.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'upload-slot';
    div.innerHTML = `<img class="upload-img" src="${item.dataUrl}"><button class="upload-del" data-idx="${idx}">×</button>`;
    uPreviewGrid.appendChild(div);
  });
  if (uploadQueue.length < 9) {
    const add = document.createElement('div');
    add.className = 'upload-slot upload-add';
    add.id = 'uAddBtn';
    add.textContent = '+';
    add.onclick = () => uFile.click();
    uPreviewGrid.appendChild(add);
  }
  uPreviewGrid.querySelectorAll('.upload-del').forEach(b => b.onclick = e => {
    e.stopPropagation();
    uploadQueue.splice(+b.dataset.idx, 1);
    renderUploadGrid();
  });
}

uFile.onchange = () => {
  const files = Array.from(uFile.files);
  if (!files.length) return;
  const remain = 9 - uploadQueue.length;
  if (remain <= 0) { showToast('最多 9 张照片'); return; }
  const take = files.slice(0, remain);
  for (const f of take) {
    const reader = new FileReader();
    reader.onload = e => { uploadQueue.push({ dataUrl: e.target.result, file: f }); renderUploadGrid(); };
    reader.readAsDataURL(f);
  }
  uFile.value = '';
};

function resizeImage(dataUrl, maxW = 1200, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * (maxW / w); w = maxW; }
      if (h > maxW) { w = w * (maxW / h); h = maxW; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = e => resolve(e.target.result); r.onerror = reject; r.readAsDataURL(file); });
}

async function dataUrlToB64(dataUrl) {
  const r = await fetch(dataUrl);
  const b = await r.blob();
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result.split(',')[1]);
    fr.onerror = reject;
    fr.readAsDataURL(b);
  });
}

document.getElementById('uSubmit').onclick = async () => {
  if (!uploadQueue.length) { showToast('请先选择照片'); return; }
  setStatus('发布中…', true);
  const note = document.getElementById('uNote').value;
  try {
    for (const item of uploadQueue) {
      const resized = await resizeImage(item.dataUrl);
      const b64 = await dataUrlToB64(resized);
      const filename = 'field_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) + '.jpg';
      const up = await api('up_photo', { name: filename, b64 });
      if (up.error) throw new Error(up.error);
      log.photos.unshift({
        id: id(),
        filename,
        category: 'daily',
        projectId: '',
        taskId: '',
        note,
        uploader: currentUser,
        createdAt: new Date().toISOString()
      });
    }
    await saveLog('upload photos');
    uploadQueue = [];
    document.getElementById('uNote').value = '';
    renderUploadGrid();
    modal.classList.remove('show');
    showToast('发布成功');
  } catch (e) {
    setStatus('发布失败', false);
    showToast('发布失败：' + e.message);
  }
};

function goHome() { window.location.href = 'index.html'; }

loadLog();
</script>
</body>
</html>
