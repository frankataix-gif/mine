<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>矿权申请助手</title>
<meta name="theme-color" content="#2563eb">
<style>
  :root {
    --primary:#2563eb; --primary-dark:#1d4ed8; --primary-light:#eff6ff;
    --success:#16a34a; --warning:#f59e0b; --danger:#dc2626;
    --gray:#6b7280; --light:#f3f4f6; --border:#e5e7eb;
    --card:#ffffff; --text:#1f2937; --muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--light);color:var(--text);line-height:1.55;font-size:15px}
  .header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
    padding:12px 16px;position:sticky;top:0;z-index:101;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .header h1{font-size:1.05rem;font-weight:700;flex:1}
  .syncdot{width:10px;height:10px;border-radius:50%;background:#4ade80;flex:0 0 10px}
  .syncdot.off{background:#f87171}.syncdot.busy{background:#fbbf24;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.3}}
  .appsel{background:#fff;padding:10px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;overflow-x:auto}
  .appsel select{flex:1;min-width:0;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
  .licbadge{font-size:12px;font-weight:700;color:#fff;background:var(--primary);border-radius:6px;padding:2px 8px;white-space:nowrap}
  main{padding:12px;padding-bottom:84px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card h2{font-size:1rem;margin-bottom:8px}
  .card h3{font-size:.9rem;color:var(--muted);margin:12px 0 6px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{min-width:0}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 14px;border:none;border-radius:8px;font-size:14px;cursor:pointer;
    background:var(--primary);color:#fff;min-height:40px;white-space:nowrap}
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .btn.sm{padding:6px 10px;font-size:13px;min-height:34px}
  .btn.gray{background:var(--gray)}
  .btn.green{background:var(--success)}
  .btn.warn{background:var(--warning)}
  .btn.danger{background:var(--danger)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  /* 文档行 */
  .doc{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
  .doc:last-child{border-bottom:none}
  .doc-body{flex:1;min-width:0}
  .doc-name{font-size:14px;font-weight:600}
  .doc-cn{font-size:12px;color:var(--muted)}
  .doc-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .doc-meta a{color:var(--primary)}
  .chip{flex:0 0 auto;min-width:58px;text-align:center;font-size:12px;font-weight:700;
    border-radius:14px;padding:5px 10px;border:none;cursor:pointer}
  .chip.s0{background:#f3f4f6;color:var(--gray)}
  .chip.s1{background:#fef3c7;color:#92400e}
  .chip.s2{background:#dcfce7;color:#166534}
  .chip.s3{background:#fee2e2;color:#991b1b}
  .doc input[type=date]{width:auto;padding:4px 6px;font-size:12px}
  .doc input.note{width:130px;padding:4px 6px;font-size:12px}
  /* 进度条 */
  .pbar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
  .pfill{height:100%;background:var(--success);width:0;transition:width .3s}
  /* tabs */
  .tabs{background:#fff;border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:100;
    padding-bottom:env(safe-area-inset-bottom,0)}
  .tabs-inner{display:flex;padding:6px 4px}
  .tab{flex:1;padding:9px 2px;border:none;background:transparent;font-size:.85rem;color:var(--gray);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
  .tab .ti{font-size:1.1rem}
  .tab.active{color:var(--primary);font-weight:700;background:var(--primary-light)}
  .pane{display:none}.pane.active{display:block}
  /* 人员列表 */
  .person{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
  .person input{flex:1;min-width:80px;padding:6px 8px;font-size:13px}
  .person .pct{max-width:64px}
  .person .del{flex:0 0 auto;background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px}
  /* 审查 */
  .chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .chk:last-child{border-bottom:none}
  .chk-ic{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:13px;font-weight:700;margin-top:1px}
  .chk-ic.ok{background:var(--success)}.chk-ic.warn{background:var(--warning)}.chk-ic.fail{background:var(--danger)}.chk-ic.na{background:var(--gray)}
  .chk-t{font-size:14px;font-weight:600}
  .chk-d{font-size:12.5px;color:var(--muted)}
  .verdict{padding:12px;border-radius:10px;font-weight:700;text-align:center;margin-top:10px}
  .verdict.ok{background:#dcfce7;color:#166534}
  .verdict.warn{background:#fef3c7;color:#92400e}
  .verdict.fail{background:#fee2e2;color:#991b1b}
  /* 坐标 */
  .coord{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .coord input{flex:1;padding:7px 8px;font-size:13px;font-family:ui-monospace,Consolas,monospace}
  .coord .del{flex:0 0 auto;background:none;border:none;color:var(--danger);font-size:17px;cursor:pointer;padding:4px}
  .coord .bad{flex:0 0 auto;color:var(--danger);font-size:11px}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .stat{background:var(--light);border-radius:8px;padding:8px 10px}
  .stat .v{font-size:17px;font-weight:700}
  .stat .k{font-size:11.5px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;
    align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:560px;padding:18px;max-height:86vh;overflow-y:auto}
  .sheet h3{font-size:1rem;margin-bottom:10px}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:#fff;
    padding:9px 18px;border-radius:20px;font-size:13px;z-index:300;display:none;white-space:nowrap}
  .banner{background:#fef3c7;color:#92400e;font-size:12.5px;padding:7px 14px;border-bottom:1px solid #fde68a;display:none}
  .banner.show{display:block}
  .tipbox{background:var(--primary-light);border-radius:8px;padding:9px 12px;font-size:12.5px;color:#1e40af;margin-bottom:10px}
  .viewer{position:fixed;inset:0;background:#fff;z-index:400;display:none;flex-direction:column}
  .viewer.show{display:flex}
  .viewer-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex:0 0 auto}
  .viewer-hd .vtitle{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer-bd{flex:1;overflow-y:auto;padding:10px;background:#525659}
  .viewer-bd canvas{display:block;width:100%;max-width:900px;margin:0 auto 12px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .viewer-bd img{display:block;max-width:100%;margin:0 auto}
</style>
</head>
<body>
<div class="header">
  <h1>矿权申请助手</h1>
  <span class="syncdot" id="syncdot" title="同步状态"></span>
</div>
<div class="banner" id="offlineBanner">离线模式：数据只存在本机，联网后点右上角同步</div>
<div class="appsel">
  <select id="appSel" onchange="onAppSel()"></select>
  <span class="licbadge" id="licBadge">—</span>
  <button class="btn sm" onclick="newApp()">＋申请</button>
</div>

<main>
<!-- ============ 清单 ============ -->
<div class="pane active" id="p-docs">
  <div class="tipbox">清单按 portal.miningcadastre.com 各证型上传栏整理。点状态圆片：缺 → 已收 → 已核 → 问题。<b>A 类 = 公司基础材料，B 类 = 支持性文件，C = 可选/兜底</b>。</div>
  <div class="card">
    <div class="row"><h2 style="flex:1">材料清单</h2><span class="muted" id="progTxt">0/0</span>
      <button class="btn sm green" onclick="exportPackage()">导出递交包</button></div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div id="docList"></div>
  </div>
  <div class="card">
    <h2>跟进记录（递交 / 部里反馈 / 补充材料 / 状态变更）</h2>
    <div id="tlList"></div>
    <div class="row" style="margin-top:8px">
      <select id="tlType" style="max-width:140px">
        <option>递交</option><option>缴费</option><option>部里反馈</option><option>补充材料要求</option>
        <option>已提交补充材料</option><option>获批</option><option>被拒</option><option>放弃</option><option>备注</option>
      </select>
      <input id="tlNote" placeholder="记录内容，例：MRC 要求补充 PACRA 最新打印件" style="flex:1">
      <button class="btn sm" onclick="addTl()">记一笔</button>
    </div>
  </div>
</div>

<!-- ============ 公司 ============ -->
<div class="pane" id="p-co">
  <div class="card">
    <div id="coForm"></div>
  </div>
</div>

<!-- ============ 区域 ============ -->
<div class="pane" id="p-area">
  <div class="card" id="areaCard"></div>
  <div class="card">
    <h2>坐标点（GCS_Arc1950）</h2>
    <div class="muted" style="margin-bottom:8px">格式：<code>13°24'36"S</code> 或 <code>-13.410000</code>；经纬度按秒须能被 6 整除；形状不得跨越地籍网格线。</div>
    <div id="coordList"></div>
    <div class="btnrow">
      <button class="btn sm ghost" onclick="addCoord()">＋角点</button>
      <button class="btn sm ghost" onclick="pasteCoords()">批量粘贴</button>
    </div>
  </div>
  <div class="card">
    <h2>面积核算</h2>
    <div class="stat-grid" id="areaStats"></div>
    <label>实际申请地籍单位数（如为非矩形按网格数手填）</label>
    <input id="unitsInput" type="number" min="0" oninput="onUnits()">
  </div>
</div>

<!-- ============ 审查 ============ -->
<div class="pane" id="p-review">
  <div class="card">
    <div class="row"><h2 style="flex:1">递交前审查</h2><button class="btn sm" onclick="runReview()">运行检查</button></div>
    <div id="reviewList"><div class="empty">点「运行检查」生成审查结果</div></div>
    <div id="verdict"></div>
  </div>
</div>

<!-- ============ 编写 ============ -->
<div class="pane" id="p-write">
  <div class="card">
    <h2>支持性文件编写</h2>
    <label>选择文件</label>
    <select id="genSel" onchange="renderGen()"></select>
    <div id="genParams"></div>
    <div class="btnrow">
      <button class="btn sm ghost" onclick="genFromTemplate()">模板生成</button>
      <button class="btn sm" id="aiBtn" onclick="genFromAI()">AI 编写</button>
    </div>
  </div>
  <div class="card">
    <div class="row"><h2 style="flex:1">文稿</h2><span class="muted" id="genVia"></span></div>
    <textarea id="genOut" style="min-height:280px;font-family:ui-monospace,Consolas,monospace;font-size:13px"></textarea>
    <div class="btnrow">
      <button class="btn sm green" onclick="saveDraft()">存入申请</button>
      <button class="btn sm ghost" onclick="copyDraft()">复制</button>
      <button class="btn sm" onclick="printDraft()">导出 PDF</button>
      <button class="btn sm gray" onclick="exportDoc()">.doc</button>
    </div>
  </div>
</div>
</main>

<div class="tabs"><div class="tabs-inner">
  <button class="tab active" data-p="p-docs" onclick="go(this)"><span class="ti">📋</span>清单</button>
  <button class="tab" data-p="p-co" onclick="go(this)"><span class="ti">🏢</span>公司</button>
  <button class="tab" data-p="p-area" onclick="go(this)"><span class="ti">📐</span>区域</button>
  <button class="tab" data-p="p-review" onclick="go(this)"><span class="ti">✅</span>审查</button>
  <button class="tab" data-p="p-write" onclick="go(this)"><span class="ti">✍️</span>编写</button>
</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer">
  <div class="viewer-hd"><div class="vtitle" id="vtitle"></div>
    <a class="btn sm ghost" id="vdl" target="_blank">下载</a>
    <button class="btn sm gray" onclick="closeViewer()">✕ 关闭</button></div>
  <div class="viewer-bd" id="viewerBd"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" style="display:none" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.zip,.xlsx,.csv">

<script>
/* ================= 常量 ================= */
// 部署后经门户访问 = 同源调用（中国团队走 mine.ecoboxmine.com，非洲团队走 workers.dev）；
// 本地 file:// 打开时回退到绝对地址
const API = location.protocol.startsWith('http') ? location.origin : 'https://mine-sync.frankataix.workers.dev';
const DATA_PATH = 'data/license_apps.json';
const UNIT_HA = 3.34;

const LIC = {
  LEL: { name:'大型勘探证', en:'Large Scale Exploration Licence', minU:301, maxU:59880, fee:3000, valid:'4 年' },
  SEL: { name:'小型勘探证', en:'Small Scale Exploration Licence', minU:3,   maxU:300,   fee:900,  valid:'4 年' },
  AMR: { name:'手工采矿权', en:'Artisanal Mining Right',          minU:1,   maxU:2,     fee:900,  valid:'2 年' },
};

// [key, portal英文名, 中文说明, 类别A/B/C, 需有效期, 可编写key]
const DOC_DEFS = {
  LEL: [
    ['inc',  'Certificate of Incorporation', 'PACRA 公司注册证', 'A'],
    ['cap',  'Certificate of Share Capital', '股本证书', 'A'],
    ['art',  'Articles of Association', '公司章程', 'A'],
    ['idsh', 'Identity of Directors and Shareholders', '董事及股东身份证明（NRC/护照）', 'A'],
    ['pacra','PACRA Print Out OR Form 2 or 3', 'PACRA 登记打印件 / Form 2/3', 'A'],
    ['tax',  'Valid Tax Clearance Certificate', 'ZRA 税务清关证', 'A', 1],
    ['form', 'Duly Filled in Application Form', '签署版申请表 Form I', 'A'],
    ['prog', 'Proposed Programme of Exploration Operations', '勘探工作计划（含投资承诺额）', 'B', 0, 'prog'],
    ['env',  'Environmental Management / Commitment Plan', '环境管理/承诺计划', 'B', 0, 'env'],
    ['emp',  'Proposals for Employment and Training of Citizens of Zambia', '公民雇用与培训方案', 'B', 0, 'emp'],
    ['local','Proposals for Promotion of Local Business Development', '本地商业促进方案', 'B', 0, 'local'],
    ['add',  'Additional Portal Document', '补充文件（可选）', 'C'],
  ],
  SEL: [
    ['inc',  'Certificate of Incorporation', 'PACRA 公司注册证', 'A'],
    ['cap',  'Certificate of Share Capital', '股本证书', 'A'],
    ['art',  'Articles of Association', '公司章程', 'A'],
    ['idsh', 'Identity of Directors and Shareholders', '董事及股东身份证明（含赞方股东 NRC）', 'A'],
    ['pacra','PACRA Print Out OR Form 2 or 3', 'PACRA 登记打印件 / Form 2/3', 'A'],
    ['tax',  'Valid Tax Clearance Certificate', 'ZRA 税务清关证', 'A', 1],
    ['form', 'Duly Filled in Application Form', '签署版申请表 Form I', 'A'],
    ['prog', 'Proposed Programme of Exploration Operations', '勘探工作计划（含投资承诺额）', 'B', 0, 'prog'],
    ['env',  'Environmental Management / Commitment Plan', '环境管理/承诺计划', 'B', 0, 'env'],
    ['emp',  'Proposals for Employment and Training of Citizens of Zambia', '公民雇用与培训方案', 'B', 0, 'emp'],
    ['local','Proposals for Promotion of Local Business Development', '本地商业促进方案', 'B', 0, 'local'],
    ['add',  'Additional Portal Document', '补充文件（可选）', 'C'],
  ],
  AMR: [
    ['idapp','Identity of Applicant', '申请人身份证明（公民 NRC / 合作社文件）', 'A'],
    ['form', 'Duly Filled in Application Form', '签署版申请表', 'A'],
    ['tax',  'Valid Tax Clearance Certificate', '税务清关证', 'A', 1],
    ['progm','Proposed Programme of Mining Operations', '采矿作业计划', 'B', 0, 'progm'],
    ['env',  'Environmental Commitment Plan', '环境承诺计划', 'B', 0, 'env'],
    ['emp',  'Proposals for Employment and Training of Citizens of Zambia', '公民雇用与培训方案', 'B', 0, 'emp'],
    ['local','Proposals for Promotion of Local Business Development', '本地商业促进方案', 'B', 0, 'local'],
    ['any',  'Any Further Information Which the Director May Require', '兜底补充材料', 'B'],
    ['byl',  'Cooperative Bylaws', '合作社章程（仅合作社需要）', 'C'],
    ['coop', 'Cooperative Registration Certificate', '合作社注册证（仅合作社需要）', 'C'],
    ['pacra','PACRA Print Out OR Form 2 or 3', 'PACRA 登记件（可选）', 'C'],
    ['add',  'Additional Portal Document', '补充文件（可选）', 'C'],
  ],
};
const ST_TXT = ['缺','已收','已核','问题'];

// 公司级基础文件：传一次，名下所有申请自动引用（等同门户"灰色=账户级文件"）
const CO_DOCS = [
  ['inc',  'Certificate of Incorporation', '公司注册证', 0],
  ['cap',  'Certificate of Share Capital', '股本证书', 0],
  ['art',  'Articles of Association', '公司章程', 0],
  ['idsh', 'Identity of Directors and Shareholders', '董事及股东身份证明', 0],
  ['tax',  'Valid Tax Clearance Certificate', '税务清关证', 1],
  ['pacra','PACRA Print Out / Form 2 or 3', 'PACRA 登记打印件（股东解析源）', 0],
];
// 放射性矿种：小规模/手工不可申请
const RADIO_RE = /uranium|thorium|radioactive|铀|钍|放射/i;

/* ================= 状态 ================= */
let S = { v:1, companies:[], apps:[], updatedAt:'' };
let curAppId = null, curCoId = null, uploadDocKey = null;

function loadLocal(){
  try { const s = JSON.parse(localStorage.getItem('license_helper') || 'null'); if (s && s.apps) S = s; } catch(e){}
}
function persist(){ S.updatedAt = new Date().toISOString(); localStorage.setItem('license_helper', JSON.stringify(S)); scheduleSync(); }
loadLocal();

function curApp(){ return S.apps.find(a => a.id === curAppId) || null; }
function curCo(){ return S.companies.find(c => c.id === curCoId) || null; }
function appCo(a){ return S.companies.find(c => c.id === (a||curApp())?.companyId) || null; }

/* ================= 同步（Worker → GitHub data/） ================= */
let syncTimer = null, online = navigator.onLine;
function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 1500);
}
function setDot(st){ const d = document.getElementById('syncdot'); d.className = 'syncdot' + (st==='off'?' off':st==='busy'?' busy':''); }
async function api(body){
  const r = await fetch(API + '/', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return await r.json();
}
async function syncPush(){
  if (!navigator.onLine) { setDot('off'); document.getElementById('offlineBanner').classList.add('show'); return; }
  setDot('busy');
  try {
    const res = await api({ action:'save', path:DATA_PATH, content: JSON.stringify(S), message:'license apps update' });
    setDot(res && res.ok ? '' : 'off');
    document.getElementById('offlineBanner').classList.toggle('show', !(res && res.ok));
  } catch(e){ setDot('off'); document.getElementById('offlineBanner').classList.add('show'); }
}
async function syncPull(){
  if (!navigator.onLine) { setDot('off'); return; }
  setDot('busy');
  try {
    const res = await api({ action:'read', path:DATA_PATH });
    if (res && res.content) {

/* ================= 文件解析（pdf.js 按需加载） ================= */
let _pdfjsReady=null;
function ensurePdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfjsReady) return _pdfjsReady;
  _pdfjsReady=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=API+'/media?key=media/1791888935404_fo2znj.js';
    s.onload=()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=API+'/media?key=media/1791888937047_4spjo8.js'; res(); };
    s.onerror=()=>rej(new Error('pdf.js 加载失败'));
    document.head.appendChild(s);
  });
  return _pdfjsReady;
}
// 页内文件查看器：PDF 用 pdf.js 渲染，图片直显，其他格式给下载（不走新标签页，微信里也能看）
async function viewFile(key,name){
  name=name||'文件'; $('vtitle').textContent=name;
  $('vdl').href=`${API}/media?key=${key}`; $('vdl').download=name;
  const bd=$('viewerBd'); bd.innerHTML='<div style="color:#fff;text-align:center;padding:30px">加载中…</div>';
  $('viewer').classList.add('show');
  try{
    const ext=(name.split('.').pop()||'').toLowerCase();
    const blob=await (await fetch(`${API}/media?key=${key}`)).blob();
    const url=URL.createObjectURL(blob); $('vdl').href=url;
    if(ext==='pdf'){
      await ensurePdfjs();
      const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
      bd.innerHTML='';
      for(let p=1;p<=pdf.numPages;p++){
        const pg=await pdf.getPage(p);
        const vp=pg.getViewport({scale:2});
        const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        bd.appendChild(cv);
      }
      if(!pdf.numPages) bd.innerHTML='<div style="color:#fff;text-align:center;padding:30px">空 PDF</div>';
    }else if(['jpg','jpeg','png','gif','webp'].includes(ext)){
      bd.innerHTML=''; const im=document.createElement('img'); im.src=url; bd.appendChild(im);
    }else{
      bd.innerHTML=`<div style="color:#fff;text-align:center;padding:40px">此格式（.${ext}）不支持预览<br><br><a href="${url}" download="${esc(name)}" class="btn" style="background:var(--primary);color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px">下载文件</a></div>`;
    }
  }catch(e){ bd.innerHTML=`<div style="color:#fff;text-align:center;padding:40px">打开失败：${esc(e.message)}<br><br><a href="${API}/media?key=${key}" target="_blank" class="btn" style="color:#fff">尝试新窗口打开</a></div>`; }
}
function closeViewer(){ $('viewer').classList.remove('show'); $('viewerBd').innerHTML=''; }
async function extractPdfText(blob){
  await ensurePdfjs();
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
  let t='';
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    t+=tc.items.map(i=>i.str).join(' ')+'\n';
  }
  return t;
}
// 从上传件全文提取字段；opt.people=true 才提股东/董事（章程里的法律套话会误匹配，只对 PACRA/身份件开）
function analyzeText(t, opt){
  opt=opt||{};
  const v={shareholders:[],directors:[]};
  let m;
  if(m=t.match(/(?:company|entity|enterprise|registration)\s*(?:no\.?|number|#)[:.\s]*([A-Z0-9\-\/]{4,})/i)) v.regNo=m[1];
  if(!v.regNo&&(m=t.match(/\b(\d{9,})\b/))) v.regNo=m[1]; // PACRA 号通常为 9+ 位
  if(m=t.match(/date of incorporation[:.\s]*(\d{1,2}\s*day of\s*\w+\s*\d{4}|\d{1,2}[\-\/\s](?:\w{3,9}|\d{1,2})[\-\/\s]\d{2,4})/i)) v.regDate=m[1].replace(/\s*day of\s*/,' ');
  else if(m=t.match(/incorporated[^\d]*(\d{1,2}[\-\/\s](?:\w{3,9}|\d{1,2})[\-\/\s]\d{2,4})/i)) v.regDate=m[1];
  if(m=t.match(/registered office[^a-z]{0,10}([A-Z0-9][^\n]{10,120}(?:plot|road|street|avenue|lusaka|ndola|kitwe|p\.?\s*o\.?\s*box)[^\n]{0,40})/i)) v.address=m[1].replace(/\s+/g,' ').trim();
  if(m=t.match(/share capital[^\dKk]{0,30}K?\s*([\d,]+(?:\.\d+)?)/i)) v.capital=m[1];
  else if(m=t.match(/nominal capital[^\d]{0,20}([\d,]+)/i)) v.capital=m[1];
  // 税务清关证：ZRA 格式 "Valid From DD/MM/YYYY To DD/MM/YYYY" 或 Expiry
  if(m=t.match(/(?:valid\s*(?:to|until|thru)|expir\w*)[^\d]{0,20}(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})/i)) v.taxTo=m[1];
  if(m=t.match(/clearance.*?to[^\d]{0,10}(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})/i)) v.taxTo=m[1];
  // NRC 号出现 → 视为赞比亚人证据
  v.hasNrc=/\b\d{6}\s*\/\s*\d{2}\s*\/\s*\d\b/.test(t)||/national registration card|zambian/i.test(t);
  if(opt.people){
    // 预处理：拼接跨行断开的金额（如 "140,000.0\n0 Ordinary" → "140,000.00 Ordinary"）
    t=t.replace(/(\d+\.\d)\s*\n\s*(\d{1,2}(?!\d))/g,'$1$2');
    // PACRA 打印件 Individuals 表：行格式 "NAME NATIONALITY [IDTYPE] IDNO Yes Yes [Yes] [AMOUNT CLASS]"
    // 有金额=股东（% = 金额/核定股本），无金额=董事/秘书
    let totAuth=0;
    const auth=t.match(/(?:ordinary|common|preference)[^\d]{0,10}([\d,]+(?:\.\d+)?)\s+[\d.]+/i);
    if(auth) totAuth=parseFloat(auth[1].replace(/,/g,''));
    const NATIONS='ZAMBIA|ZAMBIAN|CHINA|CHINESE|GRENADA|INDIA|INDIAN|CONGO|CONGOLESE|DRC|TANZANIA|KENYA|ZIMBABWE|BOTSWANA|NAMIBIA|ANGOLA|MOZAMBIQUE|MALAWI|SOUTH AFRICA|BRITISH|BRITAIN|USA|AMERICAN|LEBANON|LEBANESE|UAE|RUSSIA|RUSSIAN|KOREA|JAPAN|CANADA|AUSTRALIA|SWITZERLAND|SWISS|CYPRUS|MAURITIUS|SEYCHELLES|HONG KONG|NIGERIA|GHANA|EGYPT|PAKISTAN|TURKEY|BELGIUM|FRANCE|FRENCH|GERMANY|ITALY|SPAIN|PORTUGAL|NETHERLANDS|IRELAND|BRITISH VIRGIN';
    const rowRe=new RegExp(`([A-Z][A-Z'&.,\\- ]{2,}?)\\s+(${NATIONS}|[A-Z]{3,}(?=\\s+\\S*\\d))\\s+(.+?)\\s+Yes\\s+Yes(?:\\s+Yes)?(?:\\s+([\\d,]+(?:\\.\\d+)?)\\s+([A-Za-z]+))?`,'g');
    let r;
    while((r=rowRe.exec(t))){
      const nm=r[1].replace(/\s+/g,' ').trim(), nat=r[2];
      if(/LIMITED|COMPANY|REGISTERED|ADDRESS|CERTIFICATE|PRINTED|FORENAMES|SURNAMES|BENEFICIARY|NATIONALITY|IDENTITY|MEMBER/i.test(nm)) continue;
      const amt=r[4]&&/ordinary|preference|common/i.test(r[5]||'')?parseFloat(r[4].replace(/,/g,'')):0;
      const ent={name:nm,nationality:nat};
      if(amt){ ent.amount=amt; v.shareholders.push(ent); }
      else if(!v.directors.some(d=>d.name===nm)) v.directors.push(ent);
      if(/ZAMBIA/i.test(nat)) v.hasNrc=true;
    }
    // Beneficial Owners 表交叉校正：Individuals 股数与核定股本对不上时，用 BO 表金额修正
    // BO 行格式: NAME - IDNO NATIONALITY IDNO Yes [SHNAME] [NATURE] AMOUNT CLASS
    const boIdx=t.indexOf('Beneficial Owners');
    if(boIdx>=0&&v.shareholders.length){
      const boSec=t.slice(boIdx,boIdx+4000), bo={};
      const boRe=new RegExp(`([A-Z][A-Z'&.,\\- ]{2,}?)\\s*-\\s*\\S+\\s+(${NATIONS}|[A-Z]{3,})\\s+\\S+\\s+Yes\\s+.*?([\\d,]+\\.\\d+)\\s+(?:Ordinary|Preference|Common)`,'g');
      let b;
      while((b=boRe.exec(boSec))){
        bo[b[1].replace(/\s+/g,' ').trim()]=parseFloat(b[3].replace(/,/g,''));
      }
      const norm=s=>s.replace(/\s+/g,' ').trim().toUpperCase();
      const sumI=v.shareholders.reduce((s,x)=>s+x.amount,0);
      if(totAuth&&Math.abs(sumI-totAuth)>1&&Object.keys(bo).length){
        const fixed=v.shareholders.map(x=>bo[norm(x.name)]!=null?{...x,amount:bo[norm(x.name)]}:x);
        const sumF=fixed.reduce((s,x)=>s+x.amount,0);
        if(Math.abs(sumF-totAuth)<Math.abs(sumI-totAuth)) v.shareholders=fixed;
      }
    }
    const tot=totAuth||v.shareholders.reduce((s,x)=>s+x.amount,0);
    if(tot) v.shareholders.forEach(x=>x.pct=+(x.amount*100/tot).toFixed(1));
    v.zmPct=+v.shareholders.filter(x=>/ZAMBIA/i.test(x.nationality)).reduce((s,x)=>s+(x.pct||0),0).toFixed(1);
    // 完整性校验：解析出的占比合计明显低于 100% 说明有漏（断行/公司股东等）
    v.pctSum=+v.shareholders.reduce((s,x)=>s+(x.pct||0),0).toFixed(1);
    if(v.shareholders.length&&Math.abs(v.pctSum-100)>1) v.pctWarn=true;
  }
  return v;
}

function mergeProfile(c,v){
  c.profile=c.profile||{};
  for(const k of ['regNo','regDate','address','capital','taxTo']) if(v[k]&&!c.profile[k]) c.profile[k]=v[k];
  if((v.shareholders||[]).length) c.shareholders=v.shareholders;  // 股东以最新解析到的 PACRA 打印件为准，直接覆盖
  if(v.hasNrc) c.profile.hasNrc=true;
  if(v.taxTo){ c.docs=c.docs||{}; (c.docs.tax=c.docs.tax||{}).expiry=normDate(v.taxTo)||c.docs.tax.expiry; }
}
// 解析某家公司全部已传文件 → 写入 co.profile（可重复跑）
async function analyzeCo(){
  const c=curCo(); if(!c) return;
  toast('解析中（逐份读 PDF 文本层）…');
  c.profile={};
  const notes=[];
  for(const [key,en,cn] of CO_DOCS){
    const d=(c.docs||{})[key]; if(!d||!d.mediaKey||!/pdf$/i.test(d.fileName||'')) continue;
    try{
      const r=await fetch(`${API}/media?key=${d.mediaKey}`);
      if(!r.ok) throw 0;
      const t=await extractPdfText(await r.blob());
      mergeProfile(c,analyzeText(t,{people:key==='pacra'}));
      notes.push(en+':ok');
    }catch(e){ notes.push(en+':失败'); }
  }
  persist(); renderCo(); toast('解析完成：'+notes.join('，')||'无可解析文件');
}
function normDate(s){ // DD/MM/YYYY 或 DD-MM-YYYY → ISO
  const m=String(s||'').match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if(!m) return '';
  let[,d,mo,y]=m; y=y.length===2?'20'+y:y;
  return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

function parseCoord(s){
  s=String(s||'').trim(); if(!s) return null;
  let m=s.match(/^(-?\d+(?:\.\d+)?)\s*([NSEW])?$/i);
  if(m){ const dec=parseFloat(m[1]); const h=(m[2]||'').toUpperCase();
    const sec=Math.round(Math.abs(dec)*3600); return {dec: h==='S'||h==='W'?-Math.abs(dec):dec, totSec:sec, ok: sec%6===0, raw:s}; }
  m=s.match(/(\d+)[°\s]+(\d+)?['\s]*(\d+(?:\.\d+)?)?["\s]*([NSEW])?/i);
  if(m){ const d=+m[1]||0,mi=+m[2]||0,se=+m[3]||0,h=(m[4]||'').toUpperCase();
    const totSec=d*3600+mi*60+se;
    if(se%1!==0) return null;
    const dec=totSec/3600*(h==='S'||h==='W'?-1:1);
    return {dec, totSec, ok: se%6===0, raw:s, dms:`${d}°${mi}'${se}"${h}`}; }
  return null;
}

function doPasteCoords(){
  const t=$('pcText').value, a=curApp(), pts=[];
  for(const line of t.split('\n')){
    const l=line.trim(); if(!l) continue;
    // 尝试一行两个坐标：找 DMS 对或两个十进制数
    const pair=l.match(/(\d+\s*°\s*\d+\s*['′]?\s*\d+(?:\.\d+)?\s*["″]?\s*[NS])\s*[,;\s]+\s*(\d+\s*°\s*\d+\s*['′]?\s*\d+(?:\.\d+)?\s*["″]?\s*[EW])/i)
      || l.match(/(-?\d+\.\d+)\s*[,;\s]\s*(-?\d+\.\d+)/);
    if(pair){ pts.push(pair[1].replace(/\s+/g,''), pair[2].replace(/\s+/g,'')); }
    else if(l.split(/[,;\s]+/).length===1) pts.push(l);
    else { const half=l.split(/[,;]\s*|\s{2,}/); half.forEach(h=>h.trim()&&pts.push(h.trim())); }
  }
  if(pts.length){ a.area.coords=a.area.coords.filter(c=>c.trim()).concat(pts); persist(); renderCoords(); renderAreaStats(); closeSheet(); toast(`导入 ${pts.length} 个坐标值`); }
  else toast('没解析到坐标');
}
function onUnits(){ curApp().area.units=$('unitsInput').value?+$('unitsInput').value:null; persist(); }
function gridUnits(){
  const a=curApp(); if(!a) return null;
  const lats=[],lons=[];
  a.area.coords.forEach(c=>{ const p=parseCoord(c); if(p){ if(p.dec<0||/[sS]/.test(c)) lats.push(p.totSec); else lons.push(p.totSec); }});
  // 纬度为负（南半球）；经度为正（东经）。若解析不出半球，按绝对值分：13°<lat<18°范围→纬，22°<lon<34°→经
  if(!lats.length||!lons.length){
    const vals=a.area.coords.map(parseCoord).filter(Boolean).map(p=>p.totSec);
    vals.forEach(s=>{ const d=s/3600; if(d>=7&&d<=19) lats.push(s); else if(d>=21&&d<=35) lons.push(s); });
  }
  if(!lats.length||!lons.length) return null;
  const uLat=Math.round((Math.max(...lats)-Math.min(...lats))/6);
  const uLon=Math.round((Math.max(...lons)-Math.min(...lons))/6);
  return {uLat,uLon,units:uLat*uLon||Math.max(uLat,uLon)};
}

}

  // 1. 必传文件（含公司档继承）
  const req=defs.filter(d=>d[3]!=='C');
  const missing=req.filter(d=>effDoc(a,d[0],d[3]).d.status<1);
  const problematic=req.filter(d=>effDoc(a,d[0],d[3]).d.status===3);
  push(0, missing.length?'fail':'ok','必传文件齐备',
    missing.length?`缺 ${missing.length} 项：${missing.map(d=>d[1]).join('、')}`:`${req.length} 项必传文件均已收到`);
  if(problematic.length) push(0,'warn','存在标记"问题"的文件', problematic.map(d=>d[1]).join('、'));
  // 2. 税务清关证有效期
  const tax=effDoc(a,'tax','A').d;
  if(tax){ if(!tax.expiry) push(0,'warn','税务清关证未填到期日','门户要求 Valid TCC，递交前确认在有效期内');
    else if(tax.expiry<new Date().toISOString().slice(0,10)) push(0,'fail','税务清关证已过期',`到期 ${tax.expiry}`);
    else push(0,'ok','税务清关证有效',`到期 ${tax.expiry}`); }
  // 3. 资格
  if(a.type==='SEL'){
    const zm=co?(co.shareholders||[]).filter(s=>/赞|zambia/i.test(s.nationality||'')).reduce((t,s)=>t+(+s.pct||0),0):0;
    if(!co) push(0,'fail','赞比亚人持股 ≥5%（SEL 门槛）','未关联公司档案');
    else if((co.shareholders||[]).length) push(0, Math.round(zm)>=5?'ok':'fail','赞比亚人持股 ≥5%（SEL 门槛）',`当前赞方持股 ${Math.round(zm)}%：${co.shareholders.map(s=>s.name+' '+Math.round(s.pct)+'%').join('，')}`);
    else if(co.profile&&co.profile.hasNrc) push(0,'warn','赞比亚人持股 ≥5%（SEL 门槛）','文件识别到 NRC/赞方材料，请人工确认持股比例 ≥5%');
    else push(0,'fail','赞比亚人持股 ≥5%（SEL 门槛）','未识别到股东结构，上传 PACRA/股东文件后点「解析全部文件」');
  }
  if(a.type==='AMR'){
    push(0, a.applicantKind!=='company'?'ok':'fail','AMR 仅限公民个人/纯公民合作社',
      a.applicantKind==='company'?'当前主体为公司，按 2024 年新法不能持有手工采矿权':(a.applicantKind==='coop'?'合作社主体':'公民个人主体'));
  }
  // 4. 矿种
  push(0, a.commodity?'ok':'fail','矿种 Commodity', a.commodity||'门户必选，未填');
  if(a.commodity && RADIO_RE.test(a.commodity) && a.type!=='LEL')
    push(0,'fail','放射性矿种限制','放射性矿产不得申请小规模/手工矿权，只能走大型勘探证');
  // 4.5 获批矿权 ≤5（申请不限，获批数由人工维护：已批 − 被拒 − 放弃不缴费）
  if(a.applicantKind==='company' && co){
    const ext=+co.heldLicences||0, granted=S.apps.filter(x=>x.companyId===co.id&&x.status==='granted').length, held=ext+granted,
      inProg=S.apps.filter(x=>x.companyId===co.id&&!['rejected','abandoned','granted'].includes(x.status)).length;
    push(0, held>=5?'fail':held===4?'warn':'ok','同一主体获批矿权 ≤5 个',
      `${co.name}：已获批 ${held} 个（存量 ${ext} + 本工具获批 ${granted}）${held>=5?'，已达上限，本申请获批将超额':held===4?'，仅剩 1 个获批额度':''}；在办 ${inProg} 个（不限）`);
  }else if(a.applicantKind!=='company'){
    const same=x=>x.applicantKind===a.applicantKind&&x.applicantName&&x.applicantName===a.applicantName;
    const granted=S.apps.filter(x=>same(x)&&x.status==='granted').length,
      inProg=S.apps.filter(x=>same(x)&&!['rejected','abandoned','granted'].includes(x.status)).length;
    push(0, !a.applicantName?'warn':granted>=5?'fail':granted===4?'warn':'na','同一主体获批矿权 ≤5 个',
      a.applicantName?`${a.applicantName}：本工具内已获批 ${granted} 个、在办 ${inProg} 个；工具外已获批数请手动核对，合计超 5 则本申请不可获批`:'未填申请人姓名，无法核对同主体数量');
  }
  // 5. 坐标
  const pts=a.area.coords.filter(c=>c.trim());
  if(pts.length<3) push(0,'fail','坐标角点数量',`只有 ${pts.length} 个，至少 3 个角点（门户要求闭合地块）`);
  else{
    const bad=pts.map((c,i)=>({c,i,p:parseCoord(c)})).filter(x=>!x.p||!x.p.ok);
    push(0, bad.length?'fail':'ok','坐标格式（纬度/经度，秒÷6，Arc1950）',
      bad.length?`第 ${bad.map(x=>x.i+1).join('、')} 点不合规（无法解析或秒不能被 6 整除）`:`${pts.length} 个点均可解析且秒数合规；请确认数据为 GCS_Arc1950 基准`);
  }
  const g=gridUnits(), units=a.area.units??g?.units??null;
  if(units==null) push(0,'warn','地籍单位数','未能从坐标算出，请手填实际单位数');
  else push(0, units>=lic.minU&&units<=lic.maxU?'ok':'fail','面积范围',
    `${units} 单位 ≈ ${(units*UNIT_HA).toFixed(1)} ha；${a.type} 要求 ${lic.minU}–${lic.maxU} 单位`);
  push(0,'warn','地块不重叠/不跨网格线','本工具无法查重叠——递交前在 Mining Cadastre Map 上核实，系统验证时也会自动检查');
  // 6. 支持性文件文稿
  const genKeys=req.map(d=>d[5]).filter(Boolean);
  const genMissing=genKeys.filter(k=>!(a.drafts[k]||'').trim());
  push(0, genMissing.length?'warn':'ok','支持性文件文稿已起草',
    genMissing.length?`未起草：${genMissing.join('、')}（到「编写」页生成）`:'均已起草并存入申请');
  // 7. 费用
  push(0,'na','申请费参考',`${a.type} 申请费 K${lic.fee}（另加按 ha 计的年面积费，缴费后才锁定地块）`);
  push(0,'na','有效期',`${lic.valid}`);
  // 渲染
  box.innerHTML=out.map(x=>`<div class="chk"><div class="chk-ic ${x.lv}">${x.lv==='ok'?'✓':x.lv==='fail'?'✕':x.lv==='warn'?'!':'i'}</div>
    <div><div class="chk-t">${x.t}</div><div class="chk-d">${esc(x.d)}</div></div></div>`).join('');
  const fails=out.filter(x=>x.lv==='fail').length, warns=out.filter(x=>x.lv==='warn').length;
  vbox.innerHTML=`<div class="verdict ${fails?'fail':warns?'warn':'ok'}">${fails?`不可递交：${fails} 项未通过`:warns?`可递交但请处理 ${warns} 项提醒`:'全部通过，可递交'}</div>`;
}

// 极简文本→PDF（内置 Helvetica，不依赖外部库；官方文稿为英文，导出时剥离非 ASCII）
function textToPdfBlob(text){
  const clean=s=>String(s).replace(/[^\x20-\x7E]/g,' ').replace(/([\\()])/g,'\\$1');
  const lines=String(text||'').split('\n');
  const perPage=50, segs=[];
  for(let i=0;i<lines.length;i+=perPage) segs.push(lines.slice(i,i+perPage));
  if(!segs.length) segs.push(['']);
  const contents=segs.map(seg=>{
    let ops='BT /F1 11 Tf 56 792 Td 16 TL\n';
    seg.forEach(l=>{ops+=`(${clean(l)}) Tj T*\n`;});
    return ops+'ET';
  });
  const objs=[],kids=[];
  objs[0]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  contents.forEach((ops,i)=>{
    const pid=4+i*2, cid=5+i*2;
    kids.push(`${pid} 0 R`);
    objs[pid-1]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${cid} 0 R >>`;
    objs[cid-1]=`<< /Length ${ops.length} >>\nstream\n${ops}\nendstream`;
  });
  objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${contents.length} >>`;
  let pdf='%PDF-1.4\n'; const offs=[];
  objs.forEach((o,i)=>{ offs.push(pdf.length); pdf+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xp=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  offs.forEach(o=>{pdf+=String(o).padStart(10,'0')+' 00000 n \n';});
  pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xp}\n%%EOF`;
  return new Blob([pdf],{type:'application/pdf'});
}
function downloadBlob(blob,name){const el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download=name;el.click();}
// 导出递交包：公司目录/申请目录两层，文件名=门户槽位英文名
async function exportPackage(){
  const a=curApp(); if(!a) return toast('先建立申请');
  const co=appCo(a), defs=DOC_DEFS[a.type]||[];
  const safe=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'-').trim();
  const coDirName=safe(co?co.name:(a.applicantName||'_Applicant'));
  const appDirName=safe(`${a.label||'未命名'}_${a.type}`);
  const manifest=[`递交包：${coDirName} / ${appDirName}`,'生成时间：'+new Date().toISOString().slice(0,16).replace('T',' '),''];
  const files=[],missing=[];
  toast('正在打包…');
  for(const d of defs){
    const [key,en,cn,cat,,genKey]=d;
    const name=safe(en);
    const draftTxt=genKey&&(a.drafts[genKey]||'').trim();
    const eff=effDoc(a,key,cat);
    if(draftTxt){
      files.push({name:name+'.pdf',blob:textToPdfBlob(a.drafts[genKey])});
      manifest.push(`[生成文稿] ${en}.pdf`);
    }else if(eff.d.mediaKey){
      try{
        const r=await fetch(`${API}/media?key=${eff.d.mediaKey}`);
        if(!r.ok) throw new Error('http '+r.status);
        const ext=(eff.d.fileName||'').split('.').pop()||'bin';
        files.push({name:name+'.'+safe(ext),blob:await r.blob()});
        manifest.push(`[已收${eff.src==='co'?'·公司档':''}] ${name}.${safe(ext)}`);
      }catch(e){ missing.push(en+'（文件取回失败）'); manifest.push(`[取回失败] ${en}`); }
    }else if(cat!=='C'){
      missing.push(en); manifest.push(`[缺] ${en}`);
    }
  }
  manifest.push('','—— 缺失清单 ——', missing.length?missing.join('\n'):'无');
  files.push({name:'00_清单与缺口.txt',blob:new Blob([manifest.join('\n')],{type:'text/plain;charset=utf-8'})});
  if('showDirectoryPicker' in window){
    try{
      const dir=await window.showDirectoryPicker({mode:'readwrite'});
      const coDir=await dir.getDirectoryHandle(coDirName,{create:true});
      const appDir=await coDir.getDirectoryHandle(appDirName,{create:true});
      for(const f of files){
        const fh=await appDir.getFileHandle(f.name,{create:true});
        const w=await fh.createWritable(); await w.write(f.blob); await w.close();
      }
      toast(`已导出 ${files.length} 个文件 → ${coDirName}/${appDirName}`);
    }catch(e){ if(e.name!=='AbortError') toast('导出失败：'+e.message); }
  }else{
    for(const f of files){ downloadBlob(f.blob,`${coDirName}__${appDirName}__${f.name}`); await new Promise(r=>setTimeout(r,300)); }
    toast('浏览器不支持选目录，已逐个下载（文件名带前缀）');
  }
}
function exportDoc(){
  const key=$('genSel').value, text=$('genOut').value;
  if(!text.trim()) return toast('文稿为空');
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office"><head><meta charset="UTF-8"><style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5}pre{white-space:pre-wrap;font-family:'Times New Roman',serif}</style></head><body><pre>${esc(text)}</pre></body></html>`;
  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=GEN_DOCS[key].name.replace(/[^\w ]/g,'').replace(/ +/g,'_')+'.doc'; a.click();
}
