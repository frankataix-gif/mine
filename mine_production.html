<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>钽铌矿生产统计</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="矿场统计">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --primary: #2563eb;
    --danger: #ef4444;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
  header { background: var(--primary); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 17px; font-weight: 600; }
  #syncStatus { font-size: 12px; opacity: .9; margin-top: 2px; }
  #syncStatus.pending { color: #fde047; }
  nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 58px; z-index: 9; }
  nav button { flex: 1; padding: 12px 0; border: none; background: none; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; min-height: 44px; }
  nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card h3 { font-size: 14px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: #fff; box-sizing: border-box; }
  input[type=date] { width: 160px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 10px; }
  button { min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; }
  .primary { background: var(--primary); color: #fff; }
  .secondary { background: var(--border); color: var(--text); }
  .danger { background: var(--danger); color: #fff; }
  .btn-block { width: 100%; margin-top: 6px; }
  .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .quick-btns button { min-height: 34px; padding: 4px 12px; font-size: 13px; background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; }
  .quick-btns button.qactive { background: var(--primary); color: #fff; border-color: var(--primary); }
  .line-btns { display: flex; gap: 8px; }
  .line-btns button { flex: 1; min-height: 52px; font-size: 16px; font-weight: 600; background: #eff6ff; color: var(--primary); border: 2px solid #bfdbfe; border-radius: 10px; }
  .line-btns button.qactive { background: var(--primary); color: #fff; border-color: var(--primary); }
  .output-row { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
  .output-row > .row { display: flex; gap: 8px; margin-bottom: 0; align-items: center; }
  .output-row input[name=pname] { flex: 1.2; }
  .output-row input[name=pkg] { flex: 0.8; }
  .output-row .del { min-height: 36px; min-width: 36px; padding: 0; background: #fee2e2; color: var(--danger); border-radius: 8px; }
  .rec-item { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .rec-item .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .rec-item .nums { text-align: right; font-size: 13px; }
  .unsync { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: right; }
  th { color: var(--muted); font-weight: 500; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 12px; width: min(90%, 420px); max-height: 85vh; overflow-y: auto; padding: 16px; }
  .modal h3 { margin-bottom: 12px; font-size: 16px; }
  .modal .btns { display: flex; gap: 10px; margin-top: 14px; }
  .modal .btns button { flex: 1; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 200; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat-box { background: var(--card); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-box .v { font-size: 22px; font-weight: 700; color: var(--primary); }
  .stat-box .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>钽铌矿生产统计</h1>
  <div id="syncStatus">检查网络中…</div>
</header>

<nav>
  <button data-tab="entry" class="active">记一笔</button>
  <button data-tab="history">历史</button>
  <button data-tab="stats">统计</button>
  <button data-tab="settings">设置</button>
</nav>

<main>
  <!-- ============ 记一笔 ============ -->
  <section id="tab-entry">
    <div class="card">
      <div class="row">
        <div>
          <label>日期</label>
          <input type="date" id="fDate">
        </div>
        <div>
          <label>班次</label>
          <select id="fShift">
            <option>全天</option><option>早班</option><option>中班</option><option>晚班</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>产线 / 工序</label>
        <div class="line-btns" id="fLineBtns"></div>
      </div>
      <h3 style="margin-top:6px">入选（给矿）</h3>
      <div class="row">
        <div>
          <label>处理量（吨）</label>
          <input type="number" id="fInput" min="0" step="0.1" inputmode="decimal" placeholder="给矿量">
        </div>
        <div>
          <label>运行时长（小时）</label>
          <input type="number" id="fRuntime" min="0" step="0.5" inputmode="decimal" placeholder="如 6.5">
        </div>
      </div>
      <div class="row" style="margin-top:4px">
        <div><button class="secondary btn-block" id="feedXrfBtn" style="margin-top:0">📷 入选品位检测</button></div>
        <div><button class="secondary btn-block" id="feedOreBtn" style="margin-top:0">🪨 矿石照片</button></div>
      </div>
      <div id="feedArea"></div>
      <div class="hint">处理量估算办法：铲斗数 × 每斗吨数，或 给料时间 × 小时流量</div>
    </div>

    <div class="card">
      <h3>产出明细</h3>
      <div class="quick-btns" id="quickProducts"></div>
      <div id="outputRows"></div>
      <button class="secondary btn-block" id="addOutput">+ 加一行产品</button>
      <div class="hint">点上方产品名加行；📷品位=拍XRF屏自动读数，🪨矿石=物料照片存档</div>
    </div>

    <input type="file" id="fXrfPhoto" accept="image/*" multiple style="display:none">
    <input type="file" id="fOrePhoto" accept="image/*" multiple style="display:none">

    <div class="card">
      <div class="row">
        <div><label>停机时长（小时）</label><input type="number" id="fDown" min="0" step="0.5" inputmode="decimal" placeholder="0"></div>
        <div><label>停机原因</label><input type="text" id="fDownReason" placeholder="如：缺柴油/断筛网"></div>
      </div>
      <div class="field">
        <label>备注</label>
        <textarea id="fNote" rows="2" placeholder="异常、故障、缺料等"></textarea>
      </div>
    </div>

    <button class="primary btn-block" id="saveBtn" style="height:50px;font-size:16px">保存记录</button>
    <div style="height:20px"></div>
  </section>

  <!-- ============ 历史 ============ -->
  <section id="tab-history" class="hidden">
    <div class="quick-btns" id="histFilter" style="margin-bottom:10px"></div>
    <div id="historyList"></div>
  </section>

  <!-- ============ 统计 ============ -->
  <section id="tab-stats" class="hidden">
    <div class="stat-grid" id="statCards"></div>
    <div class="card">
      <h3>按日汇总（最近30天）</h3>
      <div style="overflow-x:auto"><table id="dailyTable"></table></div>
    </div>
    <div class="card">
      <h3>按产品汇总（累计）</h3>
      <div style="overflow-x:auto"><table id="prodTable"></table></div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="tab-settings" class="hidden">
    <div class="card">
      <div class="field"><label>记录人</label><input type="text" id="sRecorder" placeholder="你的名字"></div>
      <button class="primary btn-block" id="saveSettings">保存设置</button>
      <details style="margin-top:14px">
        <summary style="color:var(--muted);font-size:13px;cursor:pointer">高级设置（一般不用动）</summary>
        <div class="field" style="margin-top:10px"><label>计划工作时长（小时/天，算运转率用）</label><input type="number" id="sPlanHours" min="1" step="0.5"></div>
        <div class="field">
          <label>同步服务器（Worker 地址）</label>
          <input type="text" id="sWorker" placeholder="https://xxx.workers.dev/">
          <div class="hint">留空=自动用当前地址，无需填写</div>
        </div>
        <div class="field">
          <label>访问密码</label>
          <input type="text" id="sCode" placeholder="Worker 里设置的 ACCESS_CODE">
          <div class="hint">当前云端已取消密码，留空即可</div>
        </div>
      </details>
    </div>
    <div class="card">
      <h3>产线管理</h3>
      <div id="lineList"></div>
      <div class="row"><div><input type="text" id="newLine" placeholder="新产线名，如：跳汰机"></div>
      <div style="flex:0 0 90px"><button class="secondary" id="addLine" style="width:100%">添加</button></div></div>
    </div>
    <div class="card">
      <h3>数据</h3>
      <button class="primary btn-block" id="syncNow">立即同步</button>
      <button class="secondary btn-block" id="exportCsv" style="margin-top:8px">导出CSV备份</button>
      <button class="danger btn-block" id="wipeLocal" style="margin-top:8px">清空本机数据</button>
      <div class="hint">清空只删本机缓存，云端已同步的数据不受影响</div>
      <div class="hint" id="verInfo" style="margin-top:10px;text-align:center"></div>
    </div>
  </section>
</main>

<div id="modalRoot"></div>

<script>
/* ================= 数据层 ================= */
const APP_VERSION = '2026-09-21-v8';
const LS_REC = 'mine_records_v1';
const LS_SET = 'mine_settings_v1';

const DEFAULT_SETTINGS = {
  recorder: '',
  planHours: 10,
  workerUrl: '',
  accessCode: '',
  remotePath: 'data/production_log.json',
  lines: ['洗矿机', '摇床', '手选组'],
  products: ['手选精矿', '摇床精矿', '跳汰精矿', '中矿', '尾矿']
};

let settings = load(LS_SET, DEFAULT_SETTINGS);
if (!settings.accessCode) settings.accessCode = localStorage.getItem('mine_access_code') || '';
let records = load(LS_REC, []);

function load(key, def) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? structuredClone(def); }
  catch(e) { return structuredClone(def); }
}
function save() { localStorage.setItem(LS_REC, JSON.stringify(records)); localStorage.setItem(LS_SET, JSON.stringify(settings)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

/* ================= 记一笔 ================= */
const $ = id => document.getElementById(id);
let editId = null;

let curLine = '';
function initEntry() {
  $('fDate').value = today();
  curLine = settings.lines[0] || '';
  refreshLineSelect();
}
function refreshLineSelect() {
  if (!settings.lines.includes(curLine)) curLine = settings.lines[0] || '';
  renderLineBtns();
  renderQuickProducts();
}
function renderLineBtns() {
  $('fLineBtns').innerHTML = settings.lines.map(l =>
    `<button type="button" data-l="${l}" class="${l === curLine ? 'qactive' : ''}">${l}</button>`).join('');
  $('fLineBtns').querySelectorAll('button').forEach(b => b.onclick = () => {
    curLine = b.dataset.l;
    renderLineBtns(); renderQuickProducts();
  });
}
// 按工序关键词严格匹配产品——哪里的工艺就出哪里的产品
function productsFor(line) {
  if (/洗矿|洗砂|滚筒/.test(line)) return ['细泥', '中沙', '块矿'];
  if (/摇床/.test(line)) return ['精矿', '中矿', '精+中综合', '尾矿'];
  if (/跳汰/.test(line)) return ['精矿', '中矿', '尾矿'];
  if (/手选/.test(line)) return ['手选精矿', '手选废石'];
  return settings.products;
}
function renderQuickProducts() {
  const prods = productsFor(curLine);
  $('quickProducts').innerHTML = prods.map(p => `<button data-p="${p}">${p}</button>`).join('');
  $('quickProducts').querySelectorAll('button').forEach(b => b.onclick = () => {
    // 已有同名行 → 聚焦重量栏而不是重复加行
    const existing = [...$('outputRows').children].find(r => r.querySelector('[name=pname]').value === b.dataset.p);
    if (existing) { existing.scrollIntoView({ block: 'center' }); existing.querySelector('[name=pkg]').focus(); return; }
    addOutputRow(b.dataset.p);
  });
}
function addOutputRow(name = '', kg = '') {
  const div = document.createElement('div');
  div.className = 'output-row';
  div.innerHTML = `<div class="row"><input name="pname" placeholder="产品名" value="${name}"><input name="pkg" type="number" min="0" step="0.01" inputmode="decimal" placeholder="kg" value="${kg}"><button type="button" class="del">×</button></div>
  <div class="row" style="margin-top:4px">
    <div><button type="button" class="secondary btn-block pxrf" style="margin-top:0;padding:5px 6px">📷 品位</button></div>
    <div><button type="button" class="secondary btn-block pore" style="margin-top:0;padding:5px 6px">🪨 矿石</button></div>
  </div>
  <div class="parea"></div>`;
  div.pointData = { xrfPhotos: [], xrf: [], ore: [] };
  div.querySelector('.del').onclick = () => div.remove();
  div.querySelector('.pxrf').onclick = () => { photoTarget = div; $('fXrfPhoto').click(); };
  div.querySelector('.pore').onclick = () => { photoTarget = div; $('fOrePhoto').click(); };
  $('outputRows').appendChild(div);
}

$('addOutput').onclick = () => addOutputRow();

/* ================= 品位点照片（XRF检测+矿石照，挂在各品位栏） ================= */
const feedData = { xrfPhotos: [], xrf: [], ore: [] };
let photoTarget = null;   // 'feed' 或 output-row div

function getPoint(t) { return t === 'feed' ? feedData : t.pointData; }
function getPointArea(t) { return t === 'feed' ? $('feedArea') : t.querySelector('.parea'); }

$('feedXrfBtn').onclick = () => { photoTarget = 'feed'; $('fXrfPhoto').click(); };
$('feedOreBtn').onclick = () => { photoTarget = 'feed'; $('fOrePhoto').click(); };

function compressPhoto(f, cb) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    const s = Math.min(1, 1200 / Math.max(img.width, img.height));
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', 0.55));
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
}

// 照片引用：data:开头=本机待上传；ph:xxx=已上传为仓库文件
function imgUrl(p) { return p && p.startsWith('ph:') ? 'photos/' + p.slice(3) : p; }

function photoHandler(kind) {
  return e => {
    const t = photoTarget; if (!t) return;
    [...e.target.files].forEach(f => compressPhoto(f, durl => {
      const pt = getPoint(t);
      if (kind === 'xrf') {
        pt.xrfPhotos.push(durl);
        renderPointArea(t);
        ocrPoint(t, pt.xrfPhotos.length - 1);   // 拍完即识别
      } else {
        pt.ore.push(durl);
        renderPointArea(t);
      }
    }));
    e.target.value = '';
  };
}
$('fXrfPhoto').onchange = photoHandler('xrf');
$('fOrePhoto').onchange = photoHandler('ore');

function renderPointArea(t) {
  const pt = getPoint(t); const box = getPointArea(t);
  const thumbs = (arr, kind) => arr.map((p, i) =>
    `<span style="display:inline-block;position:relative;margin:4px 6px 0 0">
      <img src="${imgUrl(p)}" data-zoom style="width:72px;height:54px;object-fit:cover;border-radius:6px;cursor:pointer">
      <button data-delp="${kind}-${i}" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;min-height:18px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:11px;padding:0">×</button>
    </span>`).join('');
  let h = '';
  if (pt.xrfPhotos.length || pt.ore.length)
    h += `<div>${thumbs(pt.xrfPhotos, 'x')}${thumbs(pt.ore, 'o')}</div>`;
  if (pt.ocrMsg) h += `<div style="font-size:12px;margin-top:4px;color:${pt.ocrMsg.err ? 'var(--danger)' : 'var(--muted)'}">${pt.ocrMsg.t}${pt.ocrMsg.err ? ' <a href="javascript:void 0" data-retry style="color:var(--primary)">重试</a>' : ''}</div>`;
  // 读数即品位：Ta/Nb 加粗前置，其余参考元素正常显示
  if (pt.xrf.length) {
    const sorted = [...pt.xrf].sort((a, b) => (a.el === 'Ta' ? 0 : a.el === 'Nb' ? 1 : 9) - (b.el === 'Ta' ? 0 : b.el === 'Nb' ? 1 : 9));
    h += '<div style="margin-top:4px">' + sorted.map(r => {
      const ri = pt.xrf.indexOf(r);
      const main = r.el === 'Ta' || r.el === 'Nb';
      return `<span style="display:inline-block;margin:2px 10px 2px 0;font-size:13px"><b>${r.el}</b> <span style="${main ? 'color:var(--primary);font-weight:700;font-size:16px' : ''}">${r.val}%</span> <a href="javascript:void 0" data-edit="${ri}" style="color:var(--primary)">编辑</a></span>`;
    }).join('') + '</div>';
  }
  h += `<a href="javascript:void 0" data-add style="font-size:12px;color:var(--muted)">+手填读数</a>`;
  box.innerHTML = h;
  box.querySelectorAll('[data-delp]').forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.delp.split('-'); const idx = +i;
    if (k === 'x') {
      pt.xrfPhotos.splice(idx, 1);
      pt.xrf = pt.xrf.filter(r => r.src !== idx);
      pt.xrf.forEach(r => { if (r.src > idx) r.src--; });
    } else pt.ore.splice(idx, 1);
    renderPointArea(t);
  });
  box.querySelectorAll('[data-zoom]').forEach(im => im.onclick = () => zoomImg(im.src));
  box.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => ocrPoint(t, pt.xrfPhotos.length - 1));
  box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const r = pt.xrf[+b.dataset.edit];
    modalPrompt(`修改 ${r.el} 数值（%）`, String(r.val), v => {
      const nv = parseFloat(v);
      if (isNaN(nv) || nv < 0 || nv > 100) { toast('数值无效'); return; }
      r.val = nv;
      renderPointArea(t);
    });
  });
  box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    modalPrompt('手填读数（格式：元素 数值，如 Ta 2.36）', 'Ta ', v => {
      const m = v.trim().match(/^([A-Za-z]{1,3})\s*([\d.]+)/);
      if (!m || isNaN(parseFloat(m[2]))) { toast('格式不对'); return; }
      pt.xrf.push({ el: m[1][0].toUpperCase() + m[1].slice(1), val: parseFloat(m[2]), src: -1 });
      renderPointArea(t);
    });
  });
}

async function photoToDataURL(p) {
  // ph: 引用 → 拉回文件转base64（OCR接口需要）
  if (!p.startsWith('ph:')) return p;
  const res = await fetch('photos/' + p.slice(3));
  const blob = await res.blob();
  return new Promise(res2 => { const r = new FileReader(); r.onload = () => res2(r.result); r.readAsDataURL(blob); });
}

async function ocrPoint(t, photoIdx) {
  const pt = getPoint(t);
  pt.ocrMsg = { t: '识别中…（约5-10秒）', err: false };
  renderPointArea(t);
  try {
    const img = await photoToDataURL(pt.xrfPhotos[photoIdx]);
    const j = await workerPost({ action: 'ocr', images: [img] });
    if (j.error || !j.elements || !Object.keys(j.elements).length) {
      pt.ocrMsg = { t: '识别失败：' + (j.error || '数值没认出来，重拍或点重试'), err: true };
      renderPointArea(t); return;
    }
    Object.entries(j.elements).forEach(([el, val]) => {
      if (!pt.xrf.some(x => x.el === el && x.val === val)) pt.xrf.push({ el, val, src: photoIdx });
    });
    pt.ocrMsg = null;
    renderPointArea(t);
  } catch (e) {
    pt.ocrMsg = { t: '识别失败：网络问题（到有信号处点重试）', err: true };
    renderPointArea(t);
  }
}

/* ================= 统计 ================= */
function renderStats() {
  const live = records.filter(r => !r.deleted);
  const since7 = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const wk = live.filter(r => r.date >= since7);
  const sumKg = arr => arr.reduce((s, r) => s + r.outputs.reduce((a, o) => a + o.kg, 0), 0);
  const sumIn = arr => arr.reduce((s, r) => s + r.input_t, 0);
  const sumRun = arr => arr.reduce((s, r) => s + r.runtime_h, 0);
  $('statCards').innerHTML = `
    <div class="stat-box"><div class="v">${sumIn(wk).toFixed(1)}t</div><div class="k">近7天处理量</div></div>
    <div class="stat-box"><div class="v">${sumKg(wk).toFixed(1)}kg</div><div class="k">近7天产出</div></div>
    <div class="stat-box"><div class="v">${sumIn(live).toFixed(1)}t</div><div class="k">累计处理量</div></div>
    <div class="stat-box"><div class="v">${sumKg(live).toFixed(1)}kg</div><div class="k">累计产出</div></div>`;

  // 按日汇总
  const days = {};
  live.forEach(r => {
    const d = days[r.date] = days[r.date] || { input: 0, kg: 0, run: 0, down: 0 };
    d.input += r.input_t; d.kg += r.outputs.reduce((a, o) => a + o.kg, 0); d.run += r.runtime_h; d.down += r.downtime_h;
  });
  const rows = Object.keys(days).sort().reverse().slice(0, 30);
  $('dailyTable').innerHTML = `<tr><th>日期</th><th>处理量t</th><th>产出kg</th><th>产率kg/t</th><th>运行h</th><th>运转率</th></tr>` +
    rows.map(d => {
      const x = days[d];
      const yield_ = x.input > 0 ? (x.kg / x.input).toFixed(2) : '—';
      const avail = x.run > 0 ? Math.round(x.run / settings.planHours * 100) + '%' : '—';
      return `<tr><td>${d.slice(5)}</td><td>${x.input.toFixed(1)}</td><td>${x.kg.toFixed(1)}</td><td>${yield_}</td><td>${x.run.toFixed(1)}</td><td>${avail}</td></tr>`;
    }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">暂无数据</td></tr>';

  // 按产品汇总
  const prods = {};
  live.forEach(r => r.outputs.forEach(o => { prods[o.product] = (prods[o.product] || 0) + o.kg; }));
  $('prodTable').innerHTML = `<tr><th>产品</th><th>累计kg</th></tr>` +
    Object.entries(prods).sort((a, b) => b[1] - a[1]).map(([p, k]) => `<tr><td>${p}</td><td>${k.toFixed(1)}</td></tr>`).join('') ||
    '<tr><td colspan="2" style="text-align:center;color:var(--muted)">暂无数据</td></tr>';
}

/* ================= 同步 ================= */
let syncing = false;

async function workerPost(payload) {
  const res = await fetch(settings.workerUrl || location.origin, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, code: settings.accessCode })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function trySync() {
  if (syncing || !navigator.onLine) { updateSyncStatus(); return false; }
  syncing = true; updateSyncStatus('同步中…');
  try {
    const remote = await workerPost({ action: 'read', path: settings.remotePath });
    let remoteRecs = [];
    if (remote && remote.content) { try { remoteRecs = JSON.parse(remote.content).records || []; } catch(e) {} }
    // 合并：按 id 取 updated_at 较新的
    const map = new Map();
    remoteRecs.forEach(r => map.set(r.id, r));
    records.forEach(r => {
      const rem = map.get(r.id);
      if (!rem || r.updated_at > rem.updated_at) map.set(r.id, r);
    });
    const merged = [...map.values()];
    // 照片先行：dataURL 传为仓库文件，记录里换成 ph: 引用（否则 JSON 超 GitHub 1MB 上限）
    await uploadPendingPhotos(merged);
    const needPush = merged.length !== remoteRecs.length ||
      merged.some(r => { const rem = remoteRecs.find(x => x.id === r.id); return !rem || rem.updated_at !== r.updated_at; });
    if (needPush) {
      await workerPost({ action: 'save', path: settings.remotePath, content: JSON.stringify({ records: merged, updated: new Date().toISOString() }), message: 'Mine production sync' });
    }
    records = merged.map(r => ({ ...r, synced: true }));
    save(); renderHistory(); renderStats();
    updateSyncStatus('已同步 ✓ ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
    syncing = false;
    return true;
  } catch (e) {
    updateSyncStatus('同步失败 · 检查网络');
    syncing = false;
    return false;
  }
}

function updateSyncStatus(msg) {
  const el = $('syncStatus');
  if (msg) { el.textContent = msg; el.className = ''; return; }
  const pending = records.filter(r => !r.synced).length;
  if (!navigator.onLine) { el.textContent = `离线模式 · ${pending}条待同步`; el.className = 'pending'; }
  else if (pending) { el.textContent = `${pending} 条待同步`; el.className = 'pending'; }
  else { el.textContent = '已同步'; el.className = ''; }
}

async function uploadPendingPhotos(list) {
  for (const r of list) {
    const conv = async (arr, tag) => {
      if (!arr) return;
      for (let i = 0; i < arr.length; i++) {
        if (!arr[i].startsWith('data:')) continue;
        const b64 = arr[i].split(',')[1];
        const name = `p_${r.id}_${tag}${i}_${b64.length}.jpg`;
        const res = await workerPost({ action: 'up_photo', name, b64 });
        if (!res.ok) throw new Error('photo upload failed');
        arr[i] = 'ph:' + name;
      }
    };
    await conv(r.feed_xrf_photos, 'fx'); await conv(r.feed_ore_photos, 'fo');
    await conv(r.photos, 'lp');   // 旧版字段兼容
    if (r.photo && r.photo.startsWith('data:')) { const a = [r.photo]; await conv(a, 'ls'); r.photo = a[0]; }
    let oi = 0;
    for (const o of (r.outputs || [])) { await conv(o.xrf_photos, 'x' + oi); await conv(o.ore_photos, 'o' + oi); oi++; }
  }
}

/* ================= 自动更新检查 ================= */
async function checkUpdate() {
  if (!navigator.onLine) return;
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.update();   // 先强制检查SW更新
    const res = await fetch('./mine_production.html?ts=' + Date.now(), { cache: 'no-store' });
    const txt = await res.text();
    const m = txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
    // 标记存"已响应过的远端版本号"：只对同一版本防重复刷新，不拦截后续新版本
    if (m && m[1] !== APP_VERSION && sessionStorage.getItem('mine_reloaded') !== m[1]) {
      // 正在编辑记录时不打断，提示保存后重开更新
      const busy = editId || $('fInput').value || $('outputRows').children.length || feedData.xrfPhotos.length || feedData.ore.length;
      if (busy) { toast('发现新版本，保存后重开App更新'); return; }
      sessionStorage.setItem('mine_reloaded', m[1]);
      toast('发现新版本，正在更新…');
      setTimeout(() => location.reload(true), 1000);
    }
  } catch (e) {}
}
window.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
window.addEventListener('focus', checkUpdate);

/* ================= 启动 ================= */
initEntry(); renderHistory(); renderStats(); renderSettings(); updateSyncStatus();
$('verInfo').textContent = '版本 ' + APP_VERSION;
trySync();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('mine_sw.js').catch(() => {});
}
